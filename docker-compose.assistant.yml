# Opt-in private supporting service; no browser-facing broker or management UI.
services:
  rabbitmq:
    image: rabbitmq:4.2-alpine
    environment:
      RABBITMQ_DEFAULT_USER: nasouj
      RABBITMQ_DEFAULT_PASS: ${NASOUJ_BROKER_PASSWORD:?Set a private broker password}
    ports:
      - '127.0.0.1:5673:5672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
