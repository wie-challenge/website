name: Architecture and security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.3.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit, domain, backup and logging tests
        shell: bash
        run: |
          mkdir -p .local
          pnpm test | tee .local/e16-unit.log
      - name: PostgreSQL integration, replay, outbox and restore drill
        shell: bash
        run: |
          mkdir -p .local
          pnpm test:integration | tee .local/e16-integration.log
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --audit-level=high
      - run: pnpm build
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: e16-verification-evidence
          include-hidden-files: true
          path: |
            test-results/
            .local/e16-integration.log
            .local/e16-unit.log
            .local/e2e-report.json
            .local/commerce-*-operator.png
            .local/catalog-*.png
            .local/ui-*.png
            .local/e02-*.png
          retention-days: 3
