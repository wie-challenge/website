name: CI and production
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions: {}
# Do not cancel a run once it could have started a production deployment.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
  application:
    permissions:
      contents: read
    uses: ./.github/workflows/pr.yml
  infrastructure:
    permissions:
      contents: read
    uses: ./.github/workflows/infrastructure-ci.yml
  required:
    if: always()
    needs: [checks, application, infrastructure]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every mandatory check
        env:
          CHECKS: ${{ needs.checks.result }}
          APPLICATION: ${{ needs.application.result }}
          INFRASTRUCTURE: ${{ needs.infrastructure.result }}
        run: test "$CHECKS" = success && test "$APPLICATION" = success && test "$INFRASTRUCTURE" = success
  release:
    needs: required
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact_id: ${{ steps.publish.outputs.artifact-id }}
      sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          API_INTERNAL_URL: http://127.0.0.1:3001
      - name: Package exact tested commit
        id: bundle
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          bash scripts/deploy/package-release.sh "$RELEASE_SHA"
          digest=$(cat .local/release/release.sha256)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          printf 'Release commit: %s\n\nRelease SHA-256: %s\n' "$RELEASE_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise the packaged artifact against production PostgreSQL major
        run: python3 scripts/deploy/smoke-release.py .local/release/release.tar.gz
        env:
          POSTGRES_TEST_IMAGE: postgres:16.11-alpine
      - name: Attest the smoke-tested bundle
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: .local/release/release.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: publish
        with:
          name: production-release-${{ github.run_attempt }}
          path: |
            .local/release/release.tar.gz
            .local/release/release.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  deploy:
    needs: [required, release]
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
    uses: ./.github/workflows/deploy-production.yml
    with:
      artifact_id: ${{ needs.release.outputs.artifact_id }}
      sha256: ${{ needs.release.outputs.sha256 }}
