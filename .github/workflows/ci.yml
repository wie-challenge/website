name: CI and production
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions: {}
# Do not cancel a run once it could have started a production deployment.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
  application:
    permissions:
      contents: read
    uses: ./.github/workflows/pr.yml
  infrastructure:
    permissions:
      contents: read
    uses: ./.github/workflows/infrastructure-ci.yml
  required:
    if: always()
    needs: [checks, application, infrastructure]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every mandatory check
        env:
          CHECKS: ${{ needs.checks.result }}
          APPLICATION: ${{ needs.application.result }}
          INFRASTRUCTURE: ${{ needs.infrastructure.result }}
        run: test "$CHECKS" = success && test "$APPLICATION" = success && test "$INFRASTRUCTURE" = success
  release:
    needs: required
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      artifact_id: ${{ steps.publish.outputs.artifact-id }}
      zip_sha256: ${{ steps.publish.outputs.artifact-digest }}
      sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          API_INTERNAL_URL: http://127.0.0.1:3001
      - name: Package exact tested commit
        id: bundle
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          bash scripts/deploy/package-release.sh "$RELEASE_SHA"
          digest=$(cat .local/release/release.sha256)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          printf 'Release commit: %s\n\nRelease SHA-256: %s\n' "$RELEASE_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise the packaged artifact against production PostgreSQL major
        run: python3 scripts/deploy/smoke-release.py .local/release/release.tar.gz
        env:
          POSTGRES_TEST_IMAGE: postgres:16.11-alpine
      - name: Attest the smoke-tested bundle
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: .local/release/release.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: publish
        with:
          name: production-release-${{ github.run_attempt }}
          path: |
            .local/release/release.tar.gz
            .local/release/release.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Build signed-binding predicate from immutable upload metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.publish.outputs.artifact-id }}
          ZIP_DIGEST: ${{ steps.publish.outputs.artifact-digest }}
          BUNDLE_DIGEST: ${{ steps.bundle.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT" =~ ^[1-9][0-9]*$ && "$ZIP_DIGEST" =~ ^[a-f0-9]{64}$ && "$BUNDLE_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          timeout 20 gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT" |
            head -c 65537 |
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" \
              --arg zip "sha256:$ZIP_DIGEST" --arg bundle "$BUNDLE_DIGEST" \
              --argjson id "$ARTIFACT" --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" '
                select(.id==$id and .workflow_run.id==$run and .workflow_run.head_sha==$sha and
                       .workflow_run.head_branch=="main" and .expired==false and .digest==$zip and
                       .name==("production-release-"+($attempt|tostring)) and
                       .size_in_bytes>0 and .size_in_bytes<=1073741824) |
                {schema:1, repository:$repo, source_sha:$sha, source_ref:"refs/heads/main",
                 workflow:".github/workflows/ci.yml", run_id:$run, run_attempt:$attempt,
                 artifact_id:.id, artifact_name:.name, zip_digest:.digest,
                 bundle_sha256:$bundle, size_in_bytes:.size_in_bytes}
              ' > "$RUNNER_TEMP/nasj-artifact-binding.json"
      - name: Attest immutable artifact binding
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: .local/release/release.tar.gz
          predicate-type: https://github.com/wie-challenge/website/attestations/artifact-binding/v1
          predicate-path: ${{ runner.temp }}/nasj-artifact-binding.json
  deploy:
    needs: [required, release]
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: nasj-production
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
    steps:
      - name: Validate production SSH configuration
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          fail() { printf '::error::%s\n' "$1" >&2; exit 1; }
          [[ -n "$DEPLOY_SSH_KEY" ]] || fail 'DEPLOY_SSH_KEY is missing'
          [[ -n "$DEPLOY_KNOWN_HOSTS" ]] || fail 'DEPLOY_KNOWN_HOSTS is missing'
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$ && ${#DEPLOY_HOST} -le 253 ]] ||
            fail 'DEPLOY_HOST is missing or invalid'
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || fail 'DEPLOY_USER is missing or invalid'
          if [[ ! "$DEPLOY_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || (( DEPLOY_PORT > 65535 )); then
            fail 'DEPLOY_PORT is missing or invalid'
          fi
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/nasj-ssh.XXXXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh-keygen -y -P '' -f "$ssh_dir/key" </dev/null >/dev/null 2>&1 ||
            fail 'DEPLOY_SSH_KEY is not a valid unencrypted private key'
          host_pattern=$DEPLOY_HOST
          if (( DEPLOY_PORT != 22 )); then host_pattern="[$DEPLOY_HOST]:$DEPLOY_PORT"; fi
          if ! ssh-keygen -F "$host_pattern" -f "$ssh_dir/known_hosts" > "$ssh_dir/match" 2>/dev/null ||
             ! ssh-keygen -l -f "$ssh_dir/match" >/dev/null 2>&1; then
            fail 'DEPLOY_KNOWN_HOSTS has no valid pin for DEPLOY_HOST and DEPLOY_PORT'
          fi
          rm -- "$ssh_dir/match"
          printf 'NASJ_SSH_DIR=%s\n' "$ssh_dir" >> "$GITHUB_ENV"
          trap - EXIT
      - name: Fetch and verify exact release ZIP and bundle
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.release.outputs.artifact_id }}
          ZIP_DIGEST: ${{ needs.release.outputs.zip_sha256 }}
          BUNDLE_DIGEST: ${{ needs.release.outputs.sha256 }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$ARTIFACT" =~ ^[1-9][0-9]*$ && "$ZIP_DIGEST" =~ ^[a-f0-9]{64}$ && "$BUNDLE_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          mkdir "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          timeout 600 gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT/zip" |
            head -c 1073741825 >archive.zip
          test "$(stat -c %s archive.zip)" -le 1073741824
          printf '%s  archive.zip\n' "$ZIP_DIGEST" | sha256sum -c -
          python3 - <<'PYTHON'
          import shutil, zipfile
          with zipfile.ZipFile("archive.zip") as z:
              entries = z.infolist()
              if sorted(e.filename for e in entries) != ["release.sha256", "release.tar.gz"]:
                  raise SystemExit("Invalid ZIP entries")
              if not (z.getinfo("release.sha256").file_size == 65 and
                      0 < z.getinfo("release.tar.gz").file_size <= 1073741824):
                  raise SystemExit("Invalid ZIP sizes")
              with z.open("release.tar.gz") as src, open("release.tar.gz", "xb") as dst:
                  shutil.copyfileobj(src, dst)
              from pathlib import Path
              Path("release.sha256").write_bytes(z.read("release.sha256"))
          PYTHON
          test "$(cat release.sha256)" = "$BUNDLE_DIGEST"
          printf '%s  release.tar.gz\n' "$BUNDLE_DIGEST" | sha256sum -c -
      - name: Deploy immutable release over pinned SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
          ARTIFACT_SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          echo "$ARTIFACT_SHA256  $RUNNER_TEMP/release/release.tar.gz" | sha256sum --check --strict
          key="$NASJ_SSH_DIR/key"
          known="$NASJ_SSH_DIR/known_hosts"
          ssh -F /dev/null -i "$key" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy-attested $RELEASE_SHA sha256:$ARTIFACT_SHA256" < "$RUNNER_TEMP/release/release.tar.gz"
      - name: Remove temporary SSH credentials
        if: always()
        run: |
          if [[ -n "${NASJ_SSH_DIR:-}" ]]; then rm -rf -- "$NASJ_SSH_DIR"; fi
      - name: Record deployment result
        if: always()
        env:
          RESULT: ${{ job.status }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          echo "Production deployment $RELEASE_SHA: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESULT" != success ]; then
            echo '::error::Production deployment failed. Inspect the protected server deployment log and recovery runbook.'
          fi
