name: D5 isolated attestation fixture
on:
  push:
    branches: [infra/nasj-attestation-qualification]
permissions: {}
jobs:
  attest-fixture:
    if: github.repository == 'wie-challenge/website'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Write synthetic bundle
        run: printf '%s\n' 'NASJ synthetic D5 attestation fixture; never deploy' > fixture.txt
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: fixture.txt
      - name: Verify signature from the simulated host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify=(gh attestation verify fixture.txt --repo wie-challenge/website
            --signer-workflow wie-challenge/website/.github/workflows/d5-attestation-fixture.yml
            --source-ref refs/heads/infra/nasj-attestation-qualification
            --source-digest "$GITHUB_SHA" --deny-self-hosted-runners)
          "${verify[@]}"
          if "${verify[@]}" --source-ref refs/heads/main; then exit 1; fi
          printf 'modified\n' >> fixture.txt
          if "${verify[@]}"; then exit 1; fi
