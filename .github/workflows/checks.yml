# Fast checks on every push (~3-5 min): lint, types, unit tests, dependency audit.
# The slow tests (integration, e2e, build) run in pr.yml, once a PR is ready for review.
name: Checks
on:
  push:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.3.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit, domain, backup and logging tests
        shell: bash
        run: |
          mkdir -p .local
          pnpm test | tee .local/e16-unit.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: unit-evidence
          include-hidden-files: true
          path: .local/e16-unit.log
          retention-days: 3

  # Reads pnpm-lock.yaml only: no install needed, so it finishes in about a minute.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.3.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: pnpm audit --audit-level=high
