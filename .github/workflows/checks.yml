# Fast checks on every push (~3-5 min): lint, types, unit tests, dependency audit.
# The slow tests (integration, e2e, build) run in pr.yml, once a PR is ready for review.
name: Checks
on:
  push:
# No token permissions by default; each job asks only for what it needs.
permissions: {}
# A newer push to the same branch cancels the older, now outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit, domain, backup and logging tests
        shell: bash
        run: |
          mkdir -p .local
          pnpm test | tee .local/e16-unit.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-evidence
          include-hidden-files: true
          path: .local/e16-unit.log
          retention-days: 3

  # Reads pnpm-lock.yaml only: no install needed, so it finishes in about a minute.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: pnpm audit --audit-level=high
  