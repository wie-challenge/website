# Protected authenticated DHMAD sandbox qualification workflow.
# Never runs on PRs or production; requires protected sandbox-qualification environment secrets.
name: DHMAD Sandbox Qualification
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: dhmad-sandbox-qualification
  cancel-in-progress: false
jobs:
  qualify-sandbox:
    if: github.ref == 'refs/heads/feat/dhmad-sandbox-integration' || startsWith(github.ref, 'refs/heads/staging/')
    runs-on: ubuntu-24.04
    environment: sandbox-qualification
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_ENV: test
      PAYMENTS_ENABLED: 'true'
      PAYMENT_PROVIDER: dhmad
      DHMAD_ENVIRONMENT: sandbox
      DHMAD_BASE_URL: https://sandbox.dhmad.tn/api
      ARTISAN_PAYOUT_MODE: simulation
      REAL_PAYOUTS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @nasj/contracts build
      - name: Verify sandbox credentials and account association
        env:
          DHMAD_API_KEY: ${{ secrets.DHMAD_SANDBOX_API_KEY }}
          DHMAD_WEBHOOK_SECRET: ${{ secrets.DHMAD_SANDBOX_WEBHOOK_SECRET }}
          DHMAD_EXPECTED_SELLER_EMAIL: ${{ secrets.DHMAD_EXPECTED_SELLER_EMAIL }}
        run: |
          if [ -z "${DHMAD_API_KEY:-}" ]; then
            echo "BLOCKED_CREDENTIALS: DHMAD_SANDBOX_API_KEY secret is not configured in sandbox-qualification."
            exit 0
          fi
          case "$DHMAD_API_KEY" in
            sk_sandbox_*) ;;
            *)
              echo "ERROR: Non-sandbox key prefix rejected."
              exit 1
              ;;
          esac
          mkdir -p .local
          tsx --tsconfig apps/api/tsconfig.json apps/api/src/modules/payments/sandbox-preflight.ts | tee .local/dhmad-sandbox-preflight.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dhmad-sandbox-qualification-evidence
          include-hidden-files: true
          path: .local/
          retention-days: 14
