---
- name: Verify running NASJ services and ingress
  hosts: nasj
  become: true
  tasks:
    - name: Verify running services and valid configuration
      ansible.builtin.shell: |
        set -eu
        for unit in nasj-api nasj-web nasj-worker postgresql nginx; do
          systemctl is-active --quiet "$unit"
        done
        nginx -t
        sshd -t
        pg_isready -h 127.0.0.1
      changed_when: false
      check_mode: false

    - name: Verify public readiness
      ansible.builtin.uri:
        url: "{{ nasj_public_health_url }}"
        status_code: 200
        timeout: 10
      register: nasj_public_ready
      failed_when: nasj_public_ready.status != 200 or nasj_public_ready.json.status != 'ready'
      check_mode: false
