---
- name: Require protected backup configuration supplied through Ansible Vault
  ansible.builtin.assert:
    that:
      - nasj_backup_files is defined
      - "'backup.conf' in nasj_backup_files"
      - "'backup.aws' in nasj_backup_files"
      - "'backup.recipients' in nasj_backup_files"
      - "'backup.identity' in nasj_backup_files"
      - not (nasj_enable_monitoring | default(false) | bool) or 'notify.curl' in nasj_backup_files
  no_log: true

- name: Install backup clients and disposable restore tooling
  ansible.builtin.apt:
    name: [age, awscli, postgresql-16, postgresql-client-16, postgresql-common]
    state: present
    policy_rc_d: 101

- name: Create unprivileged restore account
  ansible.builtin.user:
    name: nasj-backup
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create protected backup state and SQL paths
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: /var/lib/nasj-backup, mode: '0700'}
    - {path: /usr/local/share/nasj, mode: '0755'}

- name: Install backup configuration without exposing secret contents
  ansible.builtin.copy:
    content: "{{ nasj_backup_files[item] }}"
    dest: "/etc/nasj/{{ item }}"
    force: false
    owner: root
    group: root
    mode: '0600'
  loop: "{{ nasj_backup_files.keys() | list }}"
  when: item in ['backup.conf', 'backup.aws', 'backup.recipients', 'backup.identity', 'backup-neon.conf', 'backup-neon.pgpass', 'notify.curl']
  no_log: true
  diff: false

- name: Install canonical backup and recovery commands
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../scripts/ops/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {src: backup.sh, dest: /etc/nasj/backup-before-migrate, mode: '0755'}
    - {src: verify-backup.sh, dest: /usr/local/libexec/nasj-verify-backup, mode: '0755'}
    - {src: refresh-neon.sh, dest: /usr/local/libexec/nasj-refresh-neon, mode: '0755'}
    - {src: monitor.sh, dest: /usr/local/libexec/nasj-monitor, mode: '0755'}
    - {src: notify.sh, dest: /usr/local/libexec/nasj-notify, mode: '0755'}
    - {src: backup-evidence.sql, dest: /usr/local/share/nasj/backup-evidence.sql, mode: '0644'}

- name: Install nightly backup units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  register: backup_units
  loop:
    - nasj-backup.service
    - nasj-backup.timer
    - nasj-monitor.service
    - nasj-monitor.timer
    - nasj-notify@.service

- name: Validate installed systemd units
  ansible.builtin.command: systemd-analyze verify /etc/systemd/system/nasj-backup.service /etc/systemd/system/nasj-backup.timer
  changed_when: false
  when: not ansible_check_mode

- name: Enable the qualified nightly backup timer
  ansible.builtin.systemd_service:
    name: nasj-backup.timer
    daemon_reload: "{{ backup_units.changed }}"
    enabled: true
    state: started
  when: nasj_enable_backup_timer | default(false) | bool

- name: Enable monitoring after notification and backup verification
  ansible.builtin.systemd_service:
    name: nasj-monitor.timer
    daemon_reload: true
    enabled: true
    state: started
  when: nasj_enable_monitoring | default(false) | bool
