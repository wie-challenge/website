---
- name: Rebind Erlang socket
  ansible.builtin.systemd_service:
    name: epmd.socket
    state: restarted
    daemon_reload: true
  when: ai_assistant_start | bool

- name: Restart private broker
  ansible.builtin.systemd_service:
    name: rabbitmq-server.service
    state: restarted
    daemon_reload: true
  when: ai_assistant_start | bool

- name: Restart website assistant worker
  ansible.builtin.systemd_service:
    name: nasj-ai-worker.service
    state: restarted
    daemon_reload: true
  when: ai_assistant_start | bool
